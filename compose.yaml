services:
  tls:
    build: .
    command: ["python", "scripts/create_dev_certificate.py", "--directory", "/tls"]
    volumes:
      - tls:/tls
    read_only: true
    security_opt: ["no-new-privileges:true"]
  api:
    build: .
    env_file: "${OIM_ENV_FILE:-.env}"
    environment:
      OIM_HOST: 0.0.0.0
      OIM_PORT: 8787
      OIM_DB: /data/oim.db
      OIM_SECRET: /data/.secret
      OIM_RECORDINGS: /recordings
      OIM_PUBLIC_URL: "${OIM_PUBLIC_URL:-https://localhost:8443}"
    volumes:
      - data:/data
      - recordings:/recordings:ro
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${OIM_BIND_ADDRESS:-127.0.0.1}:${OIM_HTTPS_PORT:-8443}:8443"
    volumes:
      - tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
      tls:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  data:
  recordings:
  tls:

